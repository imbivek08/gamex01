name: Container images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: container-images-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build-scan-push:
    name: Build, scan, and publish images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SERVER_IMAGE: ghcr.io/${{ github.repository }}/auction-server:${{ github.event.workflow_run.head_sha }}
      WEB_IMAGE: ghcr.io/${{ github.repository }}/auction-web:${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          tags: ${{ env.SERVER_IMAGE }}
          load: true
          cache-from: type=gha,scope=auction-server
          cache-to: type=gha,mode=max,scope=auction-server

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          tags: ${{ env.WEB_IMAGE }}
          load: true
          cache-from: type=gha,scope=auction-web
          cache-to: type=gha,mode=max,scope=auction-web

      - name: Scan server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVER_IMAGE }}
          format: table
          # Informational for now; remediation will be handled separately.
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.WEB_IMAGE }}
          format: table
          # Informational for now; remediation will be handled separately.
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        run: |
          docker push "$SERVER_IMAGE"
          docker push "$WEB_IMAGE"
          docker tag "$SERVER_IMAGE" "ghcr.io/${GITHUB_REPOSITORY}/auction-server:latest"
          docker tag "$WEB_IMAGE" "ghcr.io/${GITHUB_REPOSITORY}/auction-web:latest"
          docker push "ghcr.io/${GITHUB_REPOSITORY}/auction-server:latest"
          docker push "ghcr.io/${GITHUB_REPOSITORY}/auction-web:latest"
