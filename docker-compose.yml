services:
  postgres:
    image: postgres:16-alpine
    container_name: cricket-auction-db
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: cricket_auction
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d cricket_auction"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
